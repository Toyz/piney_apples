[index]
header = """
# Worklog

Running engineering log for reverse engineering the four .hack PS2 games,
starting with .hack//Infection. One file per entry under
[`worklog/`](worklog/), newest at the bottom. This index is generated by
`cairns index` - edit the entries, not this file.

Code says what; the worklog says *how we found out* and *why it is that way*.
The [reference](docs/README.md) says what is true now.
"""

[[area]]
name  = "disc"
about = "the DVD image, its file system, SYSTEM.CNF and boot"
[[area]]
name  = "format"
about = "a container or record layout decoded"
[[area]]
name  = "decomp"
about = "facts pulled out of the EE executable or its overlays"
[[area]]
name  = "iop"
about = "IOP modules, the sound driver, CD streaming"
[[area]]
name  = "engine"
about = "game loop, task system, memory, overlay loading"
[[area]]
name  = "render"
about = "GS and VU pipeline, models, textures, animation"
[[area]]
name  = "world"
about = "fields, dungeons, Root Towns, the area-word system"
[[area]]
name  = "battle"
about = "combat, skills, stats, items, monsters"
[[area]]
name  = "script"
about = "events, dialogue, the in-game desktop: mail, news, boards"
[[area]]
name  = "audio"
about = "music, sound effects, voice"
[[area]]
name  = "video"
about = "PSS movies and in-engine streams"
[[area]]
name  = "ui"
about = "menus, HUD, fonts, text encoding"
[[area]]
name  = "save"
about = "memory card data and what carries between volumes"
[[area]]
name  = "content"
about = "what is on the disc, inventories, counts"
[[area]]
name  = "volumes"
about = "how Infection, Mutation, Outbreak and Quarantine differ"
[[area]]
name  = "tooling"
about = "the extractors, disassemblers and viewers under tools/"
[[area]]
name  = "build"
about = "repository layout and how things are run"
[[area]]
name  = "test"
about = "harnesses and fixtures"

[[publish]]
name = "site"
type = "dir"
path = "site/"
