spec_version = 1

[project]
name        = "piney_apples"
slug        = "piney-apples"
description = "Reverse engineering the .hack PS2 tetralogy (CyberConnect2 / Bandai, 2002-2003), starting with .hack//Infection, using tools written for the job. No game data included."

[site]
readme = "README.md"

[docs]
dir   = "docs"
label = "Reference"

[[link]]
label = "GitHub"
icon = "github"
url  = "https://github.com/toyz/piney_apples"

#issues
[[link]]
label = "GitHub Issues"
icon = "github"
url  = "https://github.com/toyz/piney_apples/issues"

# The Piney Apple's red and its lime-green core, as accents only. The page
# itself stays a neutral grey, which is what keeps long reads readable.
[colors.dark]
paper         = "#151515"
paper-sunk    = "#1e1e1e"
ink           = "#ececea"
ink-soft      = "#bcbcb8"
ink-faint     = "#85857f"
rule          = "#2f2f2f"
rule-faint    = "#232323"
link          = "#b2d966"
accent        = "#f0444b"
code-bg       = "#1b1b1b"
mark          = "#4a2124"
code-keyword  = "#ff6b6b"
code-string   = "#b8de6f"
code-comment  = "#7d7d78"
code-number   = "#f0b357"
