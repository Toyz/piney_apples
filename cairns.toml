spec_version = 1

[project]
name        = "piney_apples"
slug        = "piney-apples"
description = "Reverse engineering the .hack PS2 tetralogy (CyberConnect2 / Bandai, 2002-2003), starting with .hack//Infection, using tools written for the job. No game data included."

[site]
readme = "README.md"

[docs]
dir   = "docs"
label = "Reference"

[[link]]
label = "GitHub"
icon = "github"
url  = "https://github.com/toyz/piney_apples"

#issues
[[link]]
label = "GitHub Issues"
icon = "github"
url  = "https://github.com/toyz/piney_apples/issues"

