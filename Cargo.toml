[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
piney-data = { path = "crates/piney-data" }
piney-input = { path = "crates/piney-input" }
piney-draw = { path = "crates/piney-draw" }
piney-gs = { path = "crates/piney-gs" }
piney-audio = { path = "crates/piney-audio" }
piney-desktop = { path = "crates/piney-desktop" }
piney-mpeg = { path = "crates/piney-mpeg" }
piney-stream = { path = "crates/piney-stream" }
piney-toppage = { path = "crates/piney-toppage" }
piney-world = { path = "crates/piney-world" }
flate2 = "1.1.10"
glam = "0.33.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The disc tests inflate and decode hundreds of megabytes; unoptimised
# dependencies make that painfully slow.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The guardrails (plans/rust-cleanup.md, section 1). Every crate takes
# them with `[lints] workspace = true`. The casts stay off: about 1,900
# deliberate PS2 casts; the readers turn them on per module.
[workspace.lints.rust]
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
exit = "warn"
print_stdout = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
needless_pass_by_value = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
# Left at warn until the parameter structs land (section 3).
too_many_arguments = "warn"
