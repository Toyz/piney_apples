[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
piney-data = { path = "crates/piney-data" }
piney-input = { path = "crates/piney-input" }
piney-draw = { path = "crates/piney-draw" }
piney-gs = { path = "crates/piney-gs" }
piney-audio = { path = "crates/piney-audio" }
piney-desktop = { path = "crates/piney-desktop" }
piney-mpeg = { path = "crates/piney-mpeg" }
piney-stream = { path = "crates/piney-stream" }
piney-toppage = { path = "crates/piney-toppage" }
piney-world = { path = "crates/piney-world" }
flate2 = "1.1.10"
glam = "0.33.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The disc tests inflate and decode hundreds of megabytes; unoptimised
# dependencies make that painfully slow.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# The guardrails (plans/rust-cleanup.md, section 1). Every crate takes them
# with `[lints] workspace = true`. The casts stay off: about 1,900 deliberate
# PS2 casts. Programs and examples print by design (each library denies
# print_stdout in its lib.rs). match_same_arms is left out: an arm a case of
# the game's switch, with its own note, is the port's record of it.
# unreachable_pub is left out: a `pub` in a private module is crate-only
# already, and the binaries have no API to guard.
[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
# Noise: the compiler checks every lifetime whether `<'_>` is written or not.
elided_lifetimes_in_paths = "allow"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
exit = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
manual_let_else = "deny"
# Left at warn until the parameter structs land (section 3).
too_many_arguments = "warn"
