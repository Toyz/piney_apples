# Every crate in the graph carries a licence deny.toml allows: the port stays
# MIT OR Apache-2.0, with no copyleft crate inside; and no crate in it has a
# RustSec advisory (vulnerable, unmaintained, unsound, yanked). cargo-deny is
# pinned, so a release that reads licences differently changes nothing
# without a commit; the advisory database is fetched fresh on each run.
name: licences

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Check the licences and advisories
        run: cargo deny check licenses advisories
