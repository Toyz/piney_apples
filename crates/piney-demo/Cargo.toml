[package]
name = "piney-demo"
version = "0.1.0"
description = "The title screen of .hack//Infection (DEMO.PRG) as a state machine: pad in, piney-draw frame out, content read from the disc."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
piney-data.workspace = true
piney-draw.workspace = true
piney-input.workspace = true
piney-desktop.workspace = true
glam.workspace = true

[dev-dependencies]
piney-gs.workspace = true

[features]
# Records ccAnm calls for tools/test_demo_rs.py (piney-desktop's anm::trace).
trace = ["piney-desktop/trace"]

[[example]]
name = "demo_probe"
required-features = ["trace"]
