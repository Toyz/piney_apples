[package]
name = "piney-gs"
version = "0.1.0"
description = "Draws piney-draw frames the way the GS draws them: its blend equation, texture functions, alpha test and Z, on wgpu."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
piney-data.workspace = true
piney-draw.workspace = true
glam.workspace = true
flate2.workspace = true
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
